version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: postgres_Fikri
    restart: always
    env_file:
      - .env
    ports:
      - "22003:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_Fikri
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "44003:80"
    depends_on:
      - postgres_db

volumes:
  pgdata: